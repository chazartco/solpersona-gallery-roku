name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 24 is the LTS the build ships from (.nvmrc); 26 is the newest release.
        node: [24, 26]
    name: build (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # BrighterScript compile + bslint, and the namespace-shadowing audit.
      - name: Lint
        run: make lint

      # The Rooibos suites (clock vectors, image choice, schedule, sync and
      # pairing state machines) run headless in brs-node — no Roku needed.
      - name: Unit tests
        run: make test

      - name: Build the sideloadable zip
        run: make zip

      - name: Upload the zip
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: solpersona-gallery-roku
          path: build/solpersona-gallery-roku.zip
          if-no-files-found: error
